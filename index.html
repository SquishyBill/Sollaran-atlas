<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Campaign Atlas</title>
  <meta name="theme-color" content="#1c120c">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><circle cx='12' cy='12' r='11' fill='%238e2b20'/><path d='M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z' fill='%23f0dca8'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Cinzel+Decorative:wght@700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="css/atlas.css">
</head>
<body>
  <canvas id="embers" aria-hidden="true"></canvas>

  <header class="topbar">
    <button class="icon-btn" id="tocBtn" title="Contents" aria-label="Contents">
      <svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h16"/></svg>
    </button>
    <div class="brand">
      <h1 id="atlasTitle">Campaign Atlas</h1>
      <p id="pageTitle">&nbsp;</p>
    </div>
    <nav class="tools">
      <button class="icon-btn" id="searchBtn" title="Search (/)" aria-label="Search">
        <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
      </button>
      <button class="icon-btn map-only" id="pingBtn" title="Ping a spot for everyone (or right-click the map)" aria-label="Ping">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
      </button>
      <button class="icon-btn map-only" id="torchBtn" title="Torchlight" aria-label="Torchlight">
        <svg viewBox="0 0 24 24"><path d="M12 2c1 3 4.5 4.6 4.5 8.4a4.5 4.5 0 0 1-9 0c0-2 1.2-3.4 2-4.7.4 1.3 1 2.1 1.9 2.4C11 6 11.3 4 12 2zM10 16h4l-1 6h-2z"/></svg>
      </button>
      <button class="icon-btn" id="aboutBtn" title="About this page &amp; party notes" aria-label="About and notes">
        <svg viewBox="0 0 24 24"><path d="M6 3h11a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6zM6 3a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2M9 8h7M9 12h7M9 16h4"/></svg>
      </button>
      <button class="icon-btn dm-only" id="editBtn" title="Edit mode" aria-label="Edit mode">
        <svg viewBox="0 0 24 24"><path d="M20 3c-6 1-11 6-13 12l-2 6 3-3c5-1 9-4 11-8l-4 1 5-3c.6-1.6 1-3.3 0-5z"/></svg>
      </button>
      <button class="dm-btn" id="dmBtn" title="Dungeon Master sign-in">DM</button>
    </nav>
  </header>

  <div class="scrim" id="scrim"></div>

  <aside class="toc" id="toc" aria-label="Contents">
    <div class="toc-head">
      <h2>Contents</h2>
      <button class="icon-btn small" id="tocClose" aria-label="Close contents"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <ol id="tocList"></ol>
    <button class="btn gold dm-only" id="addPageBtn">+ Add a page</button>
  </aside>

  <main class="stage" id="stage">
    <div class="book" id="book">
      <section class="page" id="pageView">
        <div class="map-wrap" id="mapWrap">
          <div id="map"></div>
          <div class="torch" id="torch"></div>
          <svg class="compass" id="compass" viewBox="-50 -50 100 100" aria-hidden="true">
            <circle r="44" class="c-ring"/><circle r="38" class="c-ring thin"/>
            <g class="c-rose">
              <path d="M0-40L6-6 40 0 6 6 0 40-6 6-40 0-6-6z" class="c-back"/>
              <path d="M0-40L6-6 0 0z M40 0L6 6 0 0z M0 40L-6 6 0 0z M-40 0L-6-6 0 0z" class="c-dark"/>
            </g>
            <g class="c-needle"><path d="M0-30L4 0 0 4-4 0z" class="c-north"/><path d="M0 30L4 0 0-4-4 0z" class="c-south"/></g>
            <text y="-45" class="c-n">N</text>
          </svg>
          <div class="map-status" id="mapStatus"></div>
          <div class="mode-hint" id="modeHint"></div>
          <button class="about-tab" id="aboutTab" hidden></button>
        </div>
        <article class="doc" id="docView"></article>
        <button class="corner prev" id="cornerPrev" aria-label="Previous page"></button>
        <button class="corner next" id="cornerNext" aria-label="Next page"></button>
      </section>
    </div>
    <button class="flip prev" id="prevBtn" aria-label="Previous page"><svg viewBox="0 0 24 24"><path d="M15 4l-8 8 8 8"/></svg></button>
    <button class="flip next" id="nextBtn" aria-label="Next page"><svg viewBox="0 0 24 24"><path d="M9 4l8 8-8 8"/></svg></button>
    <div class="folio" id="folio"></div>
  </main>

  <aside class="panel" id="panel" aria-live="polite">
    <div class="panel-grip"></div>
    <button class="icon-btn small panel-close" id="panelClose" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="panel-body" id="panelBody"></div>
  </aside>

  <div class="modal" id="search" hidden>
    <div class="search-card" role="dialog" aria-label="Search the atlas">
      <input id="searchInput" type="search" placeholder="Search places, pages, lore…" autocomplete="off">
      <ul id="searchResults"></ul>
    </div>
  </div>

  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <svg class="gate-seal" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11"/><path d="M12 3l2 7 7 2-7 2-2 7-2-7-7-2 7-2z"/></svg>
      <h1 id="gateTitle"></h1>
      <p id="gateMsg"></p>
      <button class="btn" id="gateBtn"></button>
    </div>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="demo-ribbon" id="demoRibbon" hidden>
    Demo mode: changes are saved in this browser only. <button id="resetDemo">Reset demo</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
